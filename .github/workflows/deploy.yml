name: Deploy by FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload Lifeplus PDF Suiza
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Swiss purchase routing
        run: python3 scripts/verificar_rutas_suiza.py

      - name: Write deploy marker
        run: |
          printf 'commit=%s\nrun=%s\nbuilt_at=%s\n' \
            '${{ github.sha }}' \
            '${{ github.run_id }}' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deploy-marker.txt

      - name: Deploy to captive FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}/
          exclude: |
            **/.git*
            **/.DS_Store
            **/.github/**
            **/.codex/**
            **/openspec/**
            **/scripts/**
            **/verificacion-*.png
            README.md

      - name: Verify public deploy
        run: |
          fetch_public() {
            url="$1"
            output="$2"
            for attempt in 1 2 3 4 5 6; do
              curl --fail --silent --show-error --location --compressed \
                --user-agent 'Mozilla/5.0 LifeplusDeployVerifier/1.0' \
                "${url}?deploy=${{ github.sha }}-${attempt}" \
                --output "${output}" || true
              if test -s "${output}" && ! grep -Fq 'One moment, please' "${output}"; then
                return 0
              fi
              sleep 5
            done
            echo "Public verification remained behind the hosting challenge: ${url}" >&2
            return 1
          }

          fetch_public \
            https://lifepluspdfch.peterestela.com/deploy-marker.txt \
            /tmp/deploy-marker.txt
          cat /tmp/deploy-marker.txt
          grep -F '${{ github.sha }}' /tmp/deploy-marker.txt
          fetch_public https://lifepluspdfch.peterestela.com/ /tmp/index.html
          grep -F 'app.js?v=20260802-pack-pdfs' /tmp/index.html
          grep -F 'catalogo-bilingue.js?v=20260802-de-batch' /tmp/index.html
          fetch_public \
            https://lifepluspdfch.peterestela.com/data/catalogo-bilingue.js \
            /tmp/catalogo-bilingue.js
          grep -F 'window.LIFEPLUS_CATALOG' /tmp/catalogo-bilingue.js
          fetch_public \
            https://lifepluspdfch.peterestela.com/data/catalogo-bilingue.json \
            /tmp/catalogo-bilingue.json
          grep -F 'No existe una ficha equivalente en Estados Unidos.' /tmp/catalogo-bilingue.json
          curl --fail --silent --show-error --location \
            https://lifepluspdfch.peterestela.com/fichas_producto/de/5509-PI_DE.pdf \
            --output /tmp/5509-PI_DE.pdf
          test "$(wc -c < /tmp/5509-PI_DE.pdf)" -eq 100077
          curl --fail --silent --show-error --location \
            https://lifepluspdfch.peterestela.com/fichas_producto/de/4174-PI_DE.pdf \
            --output /tmp/4174-PI_DE.pdf
          test "$(wc -c < /tmp/4174-PI_DE.pdf)" -eq 516382
          curl --fail --silent --show-error --location \
            https://lifepluspdfch.peterestela.com/fichas_producto/de/4144-PI_DE.pdf \
            --output /tmp/4144-PI_DE.pdf
          test "$(wc -c < /tmp/4144-PI_DE.pdf)" -eq 453743
          curl --fail --silent --show-error --location \
            https://lifepluspdfch.peterestela.com/fichas_producto/de/4173-PI_DE.pdf \
            --output /tmp/4173-PI_DE.pdf
          test "$(wc -c < /tmp/4173-PI_DE.pdf)" -eq 508710
          curl --fail --silent --show-error --location \
            https://lifepluspdfch.peterestela.com/fichas_producto/de/2629-PI_DE.pdf \
            --output /tmp/2629-PI_DE.pdf
          test "$(wc -c < /tmp/2629-PI_DE.pdf)" -eq 463057
          curl --fail --silent --show-error --location \
            https://lifepluspdfch.peterestela.com/fichas_producto/de/4133-PI_DE.pdf \
            --output /tmp/4133-PI_DE.pdf
          test "$(wc -c < /tmp/4133-PI_DE.pdf)" -eq 404261
          curl --fail --silent --show-error --location \
            https://lifepluspdfch.peterestela.com/fichas_producto/de/4158-PI_DE.pdf \
            --output /tmp/4158-PI_DE.pdf
          test "$(wc -c < /tmp/4158-PI_DE.pdf)" -eq 513894
          curl --fail --silent --show-error --location \
            https://lifepluspdfch.peterestela.com/fichas_producto/de/5044-PI_DE.pdf \
            --output /tmp/5044-PI_DE.pdf
          test "$(wc -c < /tmp/5044-PI_DE.pdf)" -eq 103821
          fetch_public \
            https://lifepluspdfch.peterestela.com/data/comercio-suiza.js \
            /tmp/comercio-suiza.js
          grep -F '"article": "5044"' /tmp/comercio-suiza.js
          fetch_public \
            https://lifepluspdfch.peterestela.com/data/comercio-suiza.json \
            /tmp/comercio-suiza.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/comercio-suiza.json'))
          by_article = {record['article']: record for record in data['products'].values()}
          for article in ('5828', '5830'):
              record = by_article[article]
              assert record['purchase'] == 'direct', (article, record)
              assert record['url'] == f'https://www.lifeplus.com/SHX4C7/ch/de/product-details/{article}'
          PY
          grep -F 'assets/products/pack-5019-de.jpg' /tmp/comercio-suiza.json
          curl --fail --silent --show-error --location \
            https://lifepluspdfch.peterestela.com/fichas_producto/de/4461-PI_DE.pdf \
            --output /tmp/4461-PI_DE.pdf
          test "$(wc -c < /tmp/4461-PI_DE.pdf)" -eq 504865
          curl --fail --silent --show-error --location \
            https://lifepluspdfch.peterestela.com/fichas_producto/de/5019-PI_DE.pdf \
            --output /tmp/5019-PI_DE.pdf
          test "$(wc -c < /tmp/5019-PI_DE.pdf)" -eq 424758
          curl --fail --silent --show-error --location \
            https://lifepluspdfch.peterestela.com/assets/products/pack-5019-de.jpg \
            --output /tmp/pack-5019-de.jpg
          test "$(wc -c < /tmp/pack-5019-de.jpg)" -eq 36823
